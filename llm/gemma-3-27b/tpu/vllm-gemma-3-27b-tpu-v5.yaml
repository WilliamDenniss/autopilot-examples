apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-gemma-3-27b-tpu-v5
spec:
  replicas: 1
  selector:
    matchLabels:
      pod: vllm-gemma-3-27b-tpu-v5
  template:
    metadata:
      labels:
        pod: vllm-gemma-3-27b-tpu-v5
        model: gemma-3-27b-it
    spec:
      containers:
      - name: inference-server
        image: docker.io/vllm/vllm-tpu:latest
        resources:
          requests:
            cpu: "10"
            ephemeral-storage: "120Gi"
            google.com/tpu: "4"
          limits:
            google.com/tpu: "4"
        command: ["vllm", "serve", "google/gemma-3-27b-it"]
        args:
        - --tensor-parallel-size=4
        - --gpu-memory-utilization=0.98
        - --max-model-len=4096
        - --max-num-seqs=16
        env:
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-secret
              key: hf_api_token
#        - name: VLLM_LOGGING_LEVEL
#          value: "DEBUG"
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 150Gi
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu-v5-lite-podslice
        cloud.google.com/gke-tpu-topology: 2x2
        cloud.google.com/gke-spot: "true"
