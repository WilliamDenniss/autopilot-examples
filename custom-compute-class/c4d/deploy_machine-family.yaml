apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-x86-m
spec:
  replicas: 1
  selector:
    matchLabels:
      pod: nginx-x86-m-pod
  template:
    metadata:
      labels:
        pod: nginx-x86-m-pod
    spec:
      nodeSelector:
        cloud.google.com/machine-family: c4d
      containers:
      - name: nginx-container
        image: nginx
        resources:
          requests:
            cpu: 40m
            memory: 40Mi
            ephemeral-storage: 100Mi
