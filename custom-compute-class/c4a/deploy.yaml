apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      pod: nginx-pod
  template:
    metadata:
      labels:
        pod: nginx-pod
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
        cloud.google.com/compute-class: c4a
      containers:
      - name: nginx-container
        image: nginx
        resources:
          requests:
            cpu: 40m
            memory: 40Mi
            ephemeral-storage: 100Mi
